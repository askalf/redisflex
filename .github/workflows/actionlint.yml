name: actionlint

# Lint workflow YAML on every PR + push so syntax errors / shellcheck
# violations / pinned-action-tag violations get caught before merge.
# No path filter — required-checks gates would never report on a
# src-only PR if filtered (classic footgun).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
