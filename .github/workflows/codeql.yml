name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '32 7 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    # Code scanning / SARIF upload needs GitHub Advanced Security on PRIVATE
    # repos, so while this repo is private the upload step errors out and shows
    # as a persistent red check on every PR (notably dependabot bumps). Skip the
    # job while private; it runs and uploads to the Security tab for free the
    # moment the repo is made public.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.35.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.35.3
        with:
          category: "/language:${{ matrix.language }}"
