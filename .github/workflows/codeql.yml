name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '32 7 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    # Code scanning / SARIF upload needs GitHub Advanced Security on PRIVATE
    # repos, so while this repo is private the upload step errors out and shows
    # as a persistent red check on every PR (notably dependabot bumps). Skip the
    # job while private; it runs and uploads to the Security tab for free the
    # moment the repo is made public.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.35.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.35.3
        with:
          category: "/language:${{ matrix.language }}"
